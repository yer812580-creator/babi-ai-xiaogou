:root {
  --ink: #140e0c;
  --cream: #f6efe6;
  --cream-dim: #e7dcd0;
  --rose: #d46a62;
  --rose-deep: #a84842;
  --mist: #a89890;
  --sans: "Noto Sans SC", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
  --serif: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif CJK SC", serif;
}
* { box-sizing: border-box; }
html {
  -webkit-font-smoothing: antialiased;
  background: var(--ink);
  color: var(--cream);
}
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--sans);
  background: var(--ink);
  overflow-x: hidden;
}
h1 { text-wrap: balance; margin: 0; }
p { text-wrap: pretty; margin: 0; }
button:not(:disabled), a.btn { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
.home {
  width: 100%;
  max-width: 64rem;
  margin: 0 auto;
  display: grid;
  align-items: center;
  gap: 2.5rem;
  padding: 2rem 1.25rem;
}
.copy {
  margin: 0 auto;
  width: 100%;
  max-width: 24rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  text-align: center;
}
.kicker { font-size: 0.75rem; letter-spacing: 0.2em; color: var(--mist); }
.title { font-family: var(--serif); font-size: 2.25rem; font-weight: 400; }
.lead { max-width: 20rem; font-size: 0.875rem; line-height: 1.7; color: var(--mist); }
.note { max-width: 20rem; font-size: 0.75rem; line-height: 1.7; color: var(--mist); }
.preview { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.qr-wrap { width: 100%; max-width: 24rem; display: flex; flex-direction: column; gap: 1rem; }
.qr-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  border-radius: 1rem;
  background: var(--cream);
  color: var(--ink);
  padding: 1.5rem 1.25rem;
}
.qr-box { width: 14rem; height: 14rem; display: grid; place-items: center; }
.qr-box img { width: 100%; height: 100%; }
.qr-wait { font-size: 0.875rem; color: var(--mist); }
.btn {
  display: inline-flex;
  width: 100%;
  min-height: 2.75rem;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border-radius: 999px;
  padding: 0.75rem 1.25rem;
  font-weight: 500;
  font-family: inherit;
  font-size: 1rem;
  text-decoration: none;
  border: 0;
  transition: scale 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
}
.btn:active:not(:disabled) { scale: 0.96; }
.btn:disabled { opacity: 0.45; }
.btn-primary { background: var(--rose); color: var(--ink); }
.btn-primary:hover:not(:disabled) { background: var(--rose-deep); }
.btn-ghost {
  border: 1px solid color-mix(in srgb, var(--cream) 28%, transparent);
  background: transparent;
  color: var(--cream);
}
.btn-ghost:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--cream) 55%, transparent);
  background: color-mix(in srgb, var(--cream) 6%, transparent);
}
.btn svg { width: 1rem; height: 1rem; }
.open {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2rem 1.25rem;
}
.open-actions { width: 100%; max-width: 20rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
.back { font-size: 0.75rem; letter-spacing: 0.2em; color: var(--mist); text-decoration: none; }
.print {
  background: var(--cream);
  padding: 0.5rem;
  border-radius: 0.2rem;
  box-shadow: 0 22px 50px rgb(0 0 0 / 0.38);
}
.portrait {
  position: relative;
  aspect-ratio: 3 / 4;
  width: min(100%, 14rem);
  overflow: hidden;
  container-type: size;
}
.is-screen .portrait { width: min(86vw, 24rem); }
.portrait img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: photo-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.drift { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.drift span {
  position: absolute;
  bottom: 10%;
  color: var(--cream);
  font-family: var(--serif);
  font-size: 1.65rem;
  line-height: 1;
  text-shadow: 0 8px 18px rgb(20 14 12 / 0.55);
  opacity: 0;
  animation: float-out 8s linear infinite;
}
.drift span:nth-child(1) { left: 12%; animation-delay: 0.85s; animation-duration: 7.5s; }
.drift span:nth-child(2) { left: 28%; animation-delay: 1.15s; font-size: 1.3rem; animation-duration: 8.6s; }
.drift span:nth-child(3) { left: 46%; animation-delay: 1.45s; animation-duration: 7.8s; }
.drift span:nth-child(4) { left: 62%; animation-delay: 0.95s; font-size: 1.9rem; animation-duration: 9s; }
.drift span:nth-child(5) { left: 74%; animation-delay: 2.8s; font-size: 1.25rem; animation-duration: 8.2s; }
.drift span:nth-child(6) { left: 18%; animation-delay: 3.4s; animation-duration: 8.8s; }
.drift span:nth-child(7) { left: 36%; animation-delay: 4.1s; font-size: 1.45rem; animation-duration: 7.6s; }
.drift span:nth-child(8) { left: 54%; animation-delay: 3.8s; animation-duration: 9.2s; }
.drift span:nth-child(9) { left: 70%; animation-delay: 4.6s; font-size: 1.7rem; animation-duration: 8.4s; }
.drift span:nth-child(10) { left: 24%; animation-delay: 5.2s; font-size: 1.2rem; animation-duration: 7.9s; }
.drift span:nth-child(11) { left: 48%; animation-delay: 5.6s; animation-duration: 8.7s; }
.drift span:nth-child(12) { left: 66%; animation-delay: 6.1s; font-size: 1.5rem; animation-duration: 9.1s; }
.caption { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
.rule {
  width: 2.25rem;
  height: 1px;
  background: var(--rose);
  transform: scaleX(0);
  animation: rule-in 0.55s ease-out 1.05s forwards;
}
.line { display: flex; justify-content: center; gap: 0.25rem; font-family: var(--serif); color: var(--cream); }
.line.card { font-size: 1.875rem; }
.line.screen { font-size: 2.25rem; }
.line span {
  display: inline-block;
  opacity: 0;
  animation: rise 0.8s cubic-bezier(0.16, 0.84, 0.32, 1) forwards;
}
.line span:nth-child(1) { animation-delay: 1.15s; }
.line span:nth-child(2) { animation-delay: 1.32s; }
.line span:nth-child(3) { animation-delay: 1.49s; }
.line span:nth-child(4) { animation-delay: 1.66s; }
.line span:nth-child(5) { animation-delay: 1.83s; }
@media (min-width: 768px) {
  .home { min-height: 100dvh; grid-template-columns: auto 22rem; justify-content: center; gap: 4rem; padding-top: 2.5rem; padding-bottom: 2.5rem; }
  .copy { grid-column: 2; }
  .preview { grid-column: 1; grid-row: 1; }
  .title { font-size: 3rem; }
}
@media (min-width: 900px) {
  .portrait { width: auto; height: min(28rem, 58vh); }
  .is-screen .portrait { height: min(34rem, 68vh); }
  .line.screen { font-size: 3rem; }
}
@media (prefers-reduced-motion: reduce) {
  .portrait img, .drift span, .line span, .rule { animation: none; }
  .drift { display: none; }
  .portrait img, .line span, .rule { opacity: 1; transform: none; }
}
@keyframes photo-in { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }
@keyframes float-out {
  0% { opacity: 0; transform: translate3d(0, 8%, 0); }
  14% { opacity: 0.92; }
  72% { opacity: 0.45; }
  100% { opacity: 0; transform: translate3d(0, -78cqh, 0); }
}
@keyframes rise { from { opacity: 0; transform: translateY(0.85rem); } to { opacity: 1; transform: translateY(0); } }
@keyframes rule-in { to { transform: scaleX(1); } }
</style>

const INK = "#140e0c";
const CREAM = "#f6efe6";
const MIST = "#a89890";
const ROSE = "#d46a62";

function isOpen() {
  return new URLSearchParams(location.search).get("v") === "open";
}
function openPageUrl() {
  const url = new URL(location.href);
  url.hash = "";
  url.searchParams.set("v", "open");
  return url.toString();
}
function homeUrl() {
  const url = new URL(location.href);
  url.hash = "";
  url.searchParams.delete("v");
  return url.pathname + url.search;
}
function revealHtml(size) {
  const floats = Array.from({ length: 12 }, (_, i) => PHRASE[i % PHRASE.length]);
  const letters = PHRASE.split("");
  return `<div class="${size === "screen" ? "is-screen" : ""}" style="display:flex;flex-direction:column;align-items:center;gap:1.25rem">
    <div class="print"><div class="portrait stage"><img src="${PHOTO}" alt="合照" draggable="false"><div class="drift" aria-hidden="true">${floats.map((c) => `<span>${c}</span>`).join("")}</div></div></div>
    <div class="caption"><div class="rule" aria-hidden="true"></div><p class="line ${size}" aria-label="${PHRASE}">${letters.map((c) => `<span>${c}</span>`).join("")}</p></div>
  </div>`;
}
function icon() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>`;
}
function redo() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`;
}

let qrData = "";
function render() {
  const app = document.getElementById("app");
  if (isOpen()) {
    app.innerHTML = `<main class="open">${revealHtml("screen")}<div class="open-actions"><button type="button" class="btn btn-ghost" id="again">${redo()}再看一次</button><a class="back" href="${homeUrl()}">回到二维码</a></div></main>`;
    document.getElementById("again").onclick = () => render();
    return;
  }
  app.innerHTML = `<main class="home">
    <section class="copy">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.75rem">
        <p class="kicker">一张码</p>
        <h1 class="title">爸比爱小狗</h1>
        <p class="lead">扫开之后，先看到这张照片，然后这句话会飘出来。</p>
      </div>
      <div class="qr-wrap">
        <div class="qr-card">
          <p class="kicker" style="color:var(--mist)">扫我</p>
          <div class="qr-box" id="qrbox"><p class="qr-wait">正在生成</p></div>
        </div>
        <button type="button" class="btn btn-primary" id="save" disabled>${icon()}保存二维码</button>
      </div>
      <a class="btn btn-ghost" href="${openPageUrl()}">全屏看一遍</a>
      <p class="note">先把这个文件夹传到 Netlify。打开得到的网址，再点保存二维码，把图片发到微信。对方长按图片，点识别图中二维码。</p>
    </section>
    <section class="preview">
      <p class="kicker">扫出来是这样</p>
      ${revealHtml("card")}
    </section>
  </main>`;
  const save = document.getElementById("save");
  save.onclick = () => saveCard();
  QRCode.toDataURL(openPageUrl(), {
    errorCorrectionLevel: "H",
    margin: 2,
    width: 760,
    color: { dark: INK, light: CREAM }
  }).then((url) => {
    qrData = url;
    document.getElementById("qrbox").innerHTML = `<img src="${url}" alt="打开照片的二维码">`;
    save.disabled = false;
  }).catch(() => {
    document.getElementById("qrbox").innerHTML = `<p class="qr-wait">刷新再试一次</p>`;
  });
}

async function saveCard() {
  if (!qrData) return;
  const save = document.getElementById("save");
  save.disabled = true;
  save.innerHTML = `${icon()}正在保存`;
  try {
    await document.fonts.load('400 92px "ZCOOL XiaoWei"', PHRASE + "扫一扫扫开就能看到照片");
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1440;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#e7dcd0";
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, canvas.width - 96, canvas.height - 96);
    ctx.fillStyle = ROSE;
    ctx.fillRect((canvas.width - 72) / 2, 196, 72, 3);
    ctx.fillStyle = MIST;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '400 36px "ZCOOL XiaoWei", sans-serif';
    ctx.fillText("扫一扫", canvas.width / 2, 150);
    const image = new Image();
    image.src = qrData;
    await image.decode();
    ctx.drawImage(image, (canvas.width - 760) / 2, 250, 760, 760);
    ctx.fillStyle = INK;
    ctx.font = '400 92px "ZCOOL XiaoWei", sans-serif';
    ctx.fillText(PHRASE, canvas.width / 2, 1148);
    ctx.fillStyle = MIST;
    ctx.font = '400 34px "ZCOOL XiaoWei", sans-serif';
    ctx.fillText("扫开就能看到照片", canvas.width / 2, 1260);
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = "爸比爱小狗.png";
    document.body.appendChild(link);
    link.click();
    link.remove();
  } finally {
    save.disabled = false;
    save.innerHTML = `${icon()}保存二维码`;
  }
}
render();
</script>
